services:
  postgres:
    image: postgres:17.11-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: probably_this_way
      POSTGRES_USER: probably_this_way
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U probably_this_way -d probably_this_way"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    image: probably-this-way-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "apps/api/dist/migrate.js"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://probably_this_way:${POSTGRES_PASSWORD}@postgres:5432/probably_this_way}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: probably-this-way-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL:-postgresql://probably_this_way:${POSTGRES_PASSWORD}@postgres:5432/probably_this_way}
      STATE_ADAPTER_TOKEN: ${STATE_ADAPTER_TOKEN:?Set STATE_ADAPTER_TOKEN}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      WEATHER_API_BASE_URL: ${WEATHER_API_BASE_URL:-https://api.open-meteo.com/v1/forecast}
      WEATHER_API_KEY: ${WEATHER_API_KEY:-}
      JEV_API_URL: ${JEV_API_URL:-https://www.jevai.org/api/v1/decisions}
      JEV_API_KEY: ${JEV_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY: "true"
      SESSION_RETENTION_DAYS: ${SESSION_RETENTION_DAYS:-30}
      RETENTION_SWEEP_INTERVAL_MS: ${RETENTION_SWEEP_INTERVAL_MS:-21600000}
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    image: probably-this-way-web:local
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_CESIUM_ION_ACCESS_TOKEN: ${VITE_CESIUM_ION_ACCESS_TOKEN:-}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
